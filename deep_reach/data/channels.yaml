# Deep-Reach curated channel registry
#
# level:
#   default      = 装好就能跑
#   optional     = 需要登录或免费 key
#   experimental = 可能不稳定
#   planned      = 只在 roadmap 出现，不伪装成可用
#
# status: ready | needs_login | needs_key | experimental | planned
# action.requires: none | login | key
#
# backend.tier (default p1); the registry always sorts p0 → p1 → p2:
#   p0 = 原生免费接口：官方 API 免费层、公开 JSON、原生 CLI（可选 key/登录）
#   p1 = OpenCLI 浏览器桥：复用已连接 Chrome 的登录态（可选登录）
#   p2 = 第三方阅读/采集服务：Jina、Firecrawl、Bright Data（可选 key）
#
# backend.key overrides channel.key; use it when p0 and p2 need different keys.
# Inside one tier the order below is preserved; across tiers it is enforced.

version: 1

channels:
  # ── default ──────────────────────────────────────────────
  bilibili:
    level: default
    status: ready
    category: social
    description: B站搜索、视频、字幕、评论
    limits: 字幕需登录；公开搜索可能触发 -412，自动回退 OpenCLI；不保证完整评论树
    not_supported: [完整评论树, 图片/视频理解]
    next_action: 字幕需要登录；在浏览器登录 bilibili.com 后重试
    key: null
    requires_key: false
    actions:
      search:
        description: 搜索视频
        requires: none
        params: [query, limit]
        backends:
          - {label: bilibili-public, tier: p0}
          - {label: opencli-bilibili, site: bilibili, command: search, args: ["{query}"], limit: true}
      read:
        description: 读取视频信息
        requires: none
        params: [target]
        backends:
          - {label: bilibili-public, tier: p0}
          - {label: opencli-bilibili, site: bilibili, command: video, args: ["{target}"]}
      subtitle:
        description: 读取视频字幕
        requires: login
        params: [target]
        backends:
          - {label: opencli-bilibili, site: bilibili, command: subtitle, args: ["{target}"]}
      comments:
        description: 读取视频评论
        requires: none
        params: [target, limit]
        backends:
          - {label: bilibili-public, tier: p0}
          - {label: opencli-bilibili, site: bilibili, command: comments, args: ["{target}"], limit: true}

