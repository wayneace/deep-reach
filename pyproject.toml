[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-reach"
version = "0.13.0"
description = "Tiered, read-write internet access layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wayneace" }]
keywords = [
  "ai-agents",
  "web-search",
  "scraping",
  "product-research",
  "patents",
  "opencli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["PyYAML>=6.0", "truststore>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/wayneace/deep-reach"
Repository = "https://github.com/wayneace/deep-reach"
Issues = "https://github.com/wayneace/deep-reach/issues"

[project.scripts]
deep-reach = "deep_reach.cli:main"

[tool.setuptools.packages.find]
include = ["deep_reach*"]

[tool.setuptools.package-data]
"deep_reach.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["deep_reach"]

[tool.coverage.report]
show_missing = true
fail_under = 55
